aid: flowaccount
name: FlowAccount
description: >-
  FlowAccount is a Thai cloud accounting platform serving 130,000+ SMEs, 17,000+
  accountants and admins, and 5,900+ accounting firms. Its products cover online
  accounting (quotations, invoices, tax invoices, receipts, expenses), MobilePOS
  point-of-sale, Payroll with bank integration, and AutoKey document capture. The
  FlowAccount Open API is an OAuth 2.0 (client-credentials) REST API of 153
  operations across sandbox and production environments, letting integrations
  create and manage sales/purchase documents, contacts, and products, receive
  webhook event callbacks, and sync POS transactions. First-party SDKs are
  published for JavaScript/TypeScript, Java, PHP, .NET, and Go.
url: https://raw.githubusercontent.com/api-evangelist/flowaccount/refs/heads/main/apis.yml
