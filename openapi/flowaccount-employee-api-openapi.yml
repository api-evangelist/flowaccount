openapi: 3.0.0
info:
  title: FlowAccount Open BatchImport Employee API
  version: 1.0.0
servers:
- url: https://openapi.flowaccount.com/sandbox
  description: The sandbox server
- url: https://openapi.flowaccount.com/v3-alpha
  description: The prod server
security:
- bearer: []
tags:
- name: Employee
paths:
  /Employee/{id}:
    get:
      tags:
      - Employee
      summary: Get employee by Id
      operationId: Employee_GetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
    delete:
      tags:
      - Employee
      summary: Delete/Remove Employee by Id
      operationId: Employee_Remove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
  /Employee:
    get:
      tags:
      - Employee
      summary: Get employee list with payrollQuery model
      operationId: Employee_GetList
      requestBody:
        x-name: queryStringModel
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollQuery'
        required: true
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
    post:
      tags:
      - Employee
      summary: Create Employee
      operationId: Employee_Create
      requestBody:
        x-name: employee
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeModel'
        required: true
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
    put:
      tags:
      - Employee
      summary: Update Employee
      operationId: Employee_Edit
      requestBody:
        x-name: employee
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeModel'
        required: true
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
  /Employee/count:
    get:
      tags:
      - Employee
      summary: Count employees
      operationId: Employee_Count
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
      - bearer: []
