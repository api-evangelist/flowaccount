overlay: 1.0.0
info:
  title: API Evangelist enhancements for FlowAccount Open API
  version: 1.0.0
extends: openapi/flowaccount-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-enrichment: '2026-07-19'
      x-apievangelist-auth: >-
        OAuth 2.0 client credentials (grant_type=client_credentials,
        scope=flowaccount-api) at {base}/token; use resulting bearer token.
      x-apievangelist-environments:
        sandbox: https://openapi.flowaccount.com/sandbox
        production: https://openapi.flowaccount.com/v3-alpha
      x-apievangelist-webhooks: asyncapi/flowaccount-webhooks.yml
      x-apievangelist-status-page: https://flowaccount.statuspage.io
  - target: $.components.securitySchemes
    update:
      oauth2ClientCredentials:
        type: oauth2
        description: >-
          FlowAccount client-credentials flow. Exchange client_id/client_secret
          at {base}/token for a bearer access token. Documented in
          github.com/flowaccount/open-api, not in the original spec.
        flows:
          clientCredentials:
            tokenUrl: https://openapi.flowaccount.com/sandbox/token
            scopes:
              flowaccount-api: Full FlowAccount Open API access for the integration.
